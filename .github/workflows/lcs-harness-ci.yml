name: LCS Harness CI

# CI lane for the Lightspeed harness profile (implementation-plan item [0.6],
# https://github.com/jameswnl/UnifAI/issues/6). Gates PRs into lcs-main.
#
# Runs the MAS unit suite minus a quarantine list of tests that were already
# failing on upstream main (tracked in issue #3). The quarantine file
# (multi-agent/tests/quarantine-lcs.txt) is a pytest args-file of --deselect
# entries; pytest args-files do not support comment lines, so context lives
# here. Shrinking that file is part of [0.3].

on:
  pull_request:
    branches: [lcs-main]
  push:
    branches: [lcs-main]
  workflow_dispatch:

jobs:
  mas-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MAS with all extras
        run: |
          pip install -e "./global_utils[multi-agent]"
          pip install -e "./multi-agent[flask,mongo,langgraph,llms,tools,a2a,claude,redis,rag,temporal,triggers,otel,test]"

      - name: Run unit tests (minus quarantine)
        working-directory: multi-agent
        run: |
          python -m pytest tests/unit -q @tests/quarantine-lcs.txt

  # Harness profile: minimal install (no a2a/claude/temporal) must import and
  # expose only the execution API surface ([0.2], issue #2).
  harness-minimal-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install harness-profile extras only
        run: |
          pip install -e "./global_utils[multi-agent]"
          pip install -e "./multi-agent[flask,mongo,langgraph,llms,tools,redis,rag,triggers,test]"

      - name: NodeSpec degrades gracefully without optional extras
        working-directory: multi-agent
        run: |
          python -c "from mas.elements.nodes.types import NodeSpec, _node_configs; print(len(_node_configs), 'node configs')"

      - name: Gating + blueprint tests
        working-directory: multi-agent
        run: |
          python -m pytest tests/unit/test_endpoint_gating.py tests/unit/blueprints -q

  # Headless E2E on the harness profile ([0.4], issue #4): live API + Mongo,
  # mock blueprint executed end-to-end. No LLM/Redis/Temporal.
  harness-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install harness-profile extras only
        run: |
          pip install -e "./global_utils[multi-agent]"
          pip install -e "./multi-agent[flask,mongo,langgraph,llms,tools,redis,rag,triggers,test]"

      - name: Start MAS API (harness profile) and run smoke test
        working-directory: multi-agent
        env:
          # ENGINE_NAME unset — exercises the new langgraph default ([4.4], #26)
          PLATFORM_ENDPOINTS: "false"
          MONGODB_IP: localhost
          MONGODB_PORT: "27017"
          MONGO_DB: UnifAI
          REDIS_IP: ""
          SECRET_KEY: harness-e2e-ci-only
        run: |
          mas api dev --port 8002 &> mas-api.log &
          python tests/e2e/harness_smoke.py --url http://localhost:8002

      - name: Server log on failure
        if: failure()
        working-directory: multi-agent
        run: tail -80 mas-api.log

  # Same headless E2E on the Postgres backend ([1.1], issue #7) plus the
  # repository contract tests. Proves the harness profile runs Mongo-free.
  harness-e2e-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unifai
          POSTGRES_PASSWORD: unifai
          POSTGRES_DB: unifai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unifai" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install harness-profile extras (postgres backend)
        run: |
          pip install -e "./global_utils[multi-agent]"
          # mongo extra = client lib only (container imports it at module
          # level; no Mongo server runs in this job)
          pip install -e "./multi-agent[flask,mongo,postgres,langgraph,llms,tools,redis,rag,triggers,test]"

      - name: Repository contract tests
        working-directory: multi-agent
        env:
          POSTGRES_DSN: postgresql://unifai:unifai@localhost:5432/unifai
        run: |
          python -m pytest tests/integration/postgres -q

      - name: Start MAS API (postgres backend, checkpointing on) and run smoke test
        working-directory: multi-agent
        env:
          ENGINE_NAME: langgraph
          PLATFORM_ENDPOINTS: "false"
          DB_BACKEND: postgres
          POSTGRES_DSN: postgresql://unifai:unifai@localhost:5432/unifai
          REDIS_IP: ""
          SECRET_KEY: harness-e2e-ci-only
          LANGGRAPH_CHECKPOINTING: "true"
          RESUME_ON_STARTUP: "true"
          # Thin harness auth on ([4.2], #24): smoke test presents the token;
          # an unauthenticated call must be rejected.
          HARNESS_AUTH_ENABLED: "true"
          HARNESS_AUTH_BEARER_TOKEN: e2e-bearer-token
        run: |
          mas api dev --port 8002 &> mas-api.log &
          sleep 6
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8002/api/sessions/session.chat.get?sessionId=x")
          test "$code" = "401" || { echo "expected 401 without token, got $code"; exit 1; }
          python tests/e2e/harness_smoke.py --url http://localhost:8002

      - name: Server log on failure
        if: failure()
        working-directory: multi-agent
        run: tail -80 mas-api.log

  # Temporal workflow determinism / replay guard ([2.7], issue #17). The
  # worker runs unsandboxed, so replay-correctness of GraphTraversal is on
  # us; this job runs the workflow on an in-process time-skipping test
  # server and replays its history. No external Temporal server needed.
  temporal-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MAS with temporal extras
        run: |
          pip install -e "./global_utils[multi-agent]"
          pip install -e "./multi-agent[flask,mongo,temporal,langgraph,llms,tools,test]"

      - name: Temporal workflow replay test
        working-directory: multi-agent
        run: |
          python -m pytest tests/integration/temporal -q
