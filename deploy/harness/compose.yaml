# Lightspeed harness profile — minimal deployment (plan items [0.1]+[1.4],
# issues #1/#10).
#
# Base profile: MAS + PostgreSQL, in-process (langgraph) engine — 2 containers.
#   SECRET_KEY=$(openssl rand -hex 32) podman compose -f deploy/harness/compose.yaml up
#
# Optional scale-out profiles (compose --profile flag):
#   streaming  → adds Redis (live NDJSON replay across processes); set REDIS_IP=redis
#   temporal   → adds Temporal server + a MAS worker (distributed engine);
#                set ENGINE_NAME=temporal REDIS_IP=redis
#   mongo      → runs MongoDB instead of Postgres; set DB_BACKEND=mongo
#
# The full platform (ui/rag/backend/identity + Mongo) deploys via helm/ —
# see deploy/harness/README.md.

name: unifai-harness

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: unifai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unifai}
      POSTGRES_DB: unifai
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifai"]
      interval: 5s
      timeout: 5s
      retries: 12

  mas-api:
    build:
      context: ../..
      dockerfile: multi-agent/Dockerfile
    image: localhost/unifai-mas:latest
    environment:
      ROLE: serve
      # Required — generate one per install (e.g. `openssl rand -hex 32`)
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in the environment or an .env file}
      PLATFORM_ENDPOINTS: "false"
      DB_BACKEND: ${DB_BACKEND:-postgres}
      POSTGRES_DSN: postgresql://unifai:${POSTGRES_PASSWORD:-unifai}@postgres:5432/unifai
      # With --profile temporal, start as: ENGINE_NAME=temporal podman compose ...
      ENGINE_NAME: ${ENGINE_NAME:-langgraph}
      TEMPORAL_HOST: temporal:7233
      # Redis is opt-in: --profile streaming + REDIS_IP=redis
      REDIS_IP: ${REDIS_IP:-}
      # Mongo settings only used with --profile mongo + DB_BACKEND=mongo
      MONGODB_IP: mongodb
      MONGODB_PORT: "27017"
      MONGO_DB: UnifAI
      PORT: "8002"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    profiles: [streaming, temporal]
    image: docker.io/library/redis:7
    volumes:
      - redis-data:/data

  temporal:
    profiles: [temporal]
    image: docker.io/temporalio/auto-setup:1.25
    environment:
      DB: sqlite
    ports:
      - "7233:7233"

  mas-worker:
    profiles: [temporal]
    image: localhost/unifai-mas:latest
    environment:
      ROLE: temporal-worker
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in the environment or an .env file}
      PLATFORM_ENDPOINTS: "false"
      ENGINE_NAME: temporal
      TEMPORAL_HOST: temporal:7233
      DB_BACKEND: ${DB_BACKEND:-postgres}
      POSTGRES_DSN: postgresql://unifai:${POSTGRES_PASSWORD:-unifai}@postgres:5432/unifai
      REDIS_IP: redis
    depends_on:
      - temporal
      - redis
      - postgres

  mongodb:
    profiles: [mongo]
    image: docker.io/library/mongo:8
    volumes:
      - mongo-data:/data/db

volumes:
  pg-data:
  redis-data:
  mongo-data:
