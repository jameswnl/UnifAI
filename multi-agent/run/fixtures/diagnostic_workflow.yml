name: "Production Diagnostic"
description: |
  Single-agent diagnostic workflow. The LLM diagnoses a Kubernetes
  cluster issue and returns structured findings with severity.

llms:
  - rid: llm
    name: openai
    type: openai
    config:
      type: openai
      model_name: gpt-4o-mini
      base_url: https://api.openai.com/v1

nodes:
  - rid: user_input
    name: User Question
    type: user_question_node
    config:
      type: user_question_node

  - rid: diagnostician
    name: Diagnostician
    type: custom_agent_node
    config:
      type: custom_agent_node
      llm: llm
      system_message: |
        You are a Kubernetes cluster diagnostician. Analyze the reported
        issue and provide a structured diagnosis with root cause, severity,
        and recommended fix. Be concise and actionable.

  - rid: final
    name: Final Answer
    type: final_answer_node
    config:
      type: final_answer_node

plan:
  - uid: input
    node: user_input
    meta:
      display_name: Incident Report

  - uid: diagnose
    after: input
    node: diagnostician
    meta:
      display_name: Diagnose
      description: Analyze the cluster issue and determine root cause

  - uid: answer
    after: diagnose
    node: final
    meta:
      display_name: Diagnosis Report
